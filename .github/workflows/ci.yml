name: ci

# Skipped when a push/PR only touches docs and examples. Releases
# (release.yml, v* tags) always run their own tests.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "*.example.yml"
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # Downloadable test builds from main (Actions → run → Artifacts).
  # These are NOT releases: releases only happen when a v* tag is pushed.
  snapshot:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,docker
      - uses: actions/upload-artifact@v7
        with:
          name: dockup-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.apk
            dist/checksums.txt
          retention-days: 14
