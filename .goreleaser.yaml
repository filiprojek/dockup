# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases happen only when a v* tag is pushed (see .github/workflows/release.yml).
version: 2

project_name: dockup

before:
  hooks:
    - go mod tidy -diff

builds:
  - main: ./cmd/dockup
    binary: dockup
    env: [CGO_ENABLED=0]
    goos: [linux] # reads /proc and uses Linux socket syscalls
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, config.example.yml, docker-compose.example.yml]

# Alpine and Debian packages. Void .xbps packages are built from the archives above by
# packaging/void/build.sh (nfpm has no xbps support).
nfpms:
  - id: apk
    package_name: dockup
    release: "0" # → pkgver <version>-r0
    formats: [apk]
    # apk arch names, so packaging/alpine/index.sh can sort them into repo dirs
    file_name_template: >-
      {{ .PackageName }}-{{ .Version }}-r0.{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "arm64" }}aarch64{{ else }}{{ .Arch }}{{ end }}
    vendor: Filip Rojek
    maintainer: Filip Rojek <filip@filiprojek.cz>
    homepage: https://github.com/filiprojek/dockup
    license: AGPL-3.0-or-later
    description: Status, update checks and updates for docker compose projects, plus host port inspection.
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/dockup/LICENSE
      - src: README.md
        dst: /usr/share/doc/dockup/README.md
      - src: config.example.yml
        dst: /usr/share/doc/dockup/config.example.yml
      - src: docker-compose.example.yml
        dst: /usr/share/doc/dockup/docker-compose.example.yml
    apk:
      signature:
        # unset (snapshots, local builds) → unsigned packages
        key_file: '{{ envOrDefault "APK_SIGNING_KEY_FILE" "" }}'
        key_name: dockup # matches /etc/apk/keys/dockup.rsa.pub

  # Debian/Ubuntu. Unsigned packages; APT trusts them through the signed
  # Release file written by packaging/debian/repo.sh.
  - id: deb
    package_name: dockup
    formats: [deb]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Filip Rojek
    maintainer: Filip Rojek <filip@filiprojek.cz>
    homepage: https://github.com/filiprojek/dockup
    license: AGPL-3.0-or-later
    description: Status, update checks and updates for docker compose projects, plus host port inspection.
    section: admin
    priority: optional
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/dockup/copyright
      - src: README.md
        dst: /usr/share/doc/dockup/README.md
      - src: config.example.yml
        dst: /usr/share/doc/dockup/config.example.yml
      - src: docker-compose.example.yml
        dst: /usr/share/doc/dockup/docker-compose.example.yml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude: ["^test:", "^ci:", "^docs:", "^chore:"]

dockers_v2:
  - dockerfile: Dockerfile.release
    images: [ghcr.io/filiprojek/dockup]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  draft: false
  prerelease: auto # v1.2.0-rc1 → pre-release, and no :latest image
