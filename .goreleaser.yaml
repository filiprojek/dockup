# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases happen only when a v* tag is pushed (see .github/workflows/release.yml).
version: 2

project_name: dockup

before:
  hooks:
    - go mod tidy -diff

builds:
  - main: ./cmd/dockup
    binary: dockup
    env: [CGO_ENABLED=0]
    goos: [linux] # reads /proc and uses Linux socket syscalls
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, config.example.yml, docker-compose.example.yml]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude: ["^test:", "^ci:", "^docs:", "^chore:"]

dockers_v2:
  - dockerfile: Dockerfile.release
    images: [ghcr.io/filiprojek/dockup]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  draft: false
  prerelease: auto # v1.2.0-rc1 → pre-release, and no :latest image
